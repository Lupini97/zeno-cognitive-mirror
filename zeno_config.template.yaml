# ── Motore epistemico (zeno_engine) ──────────────────────────────────────────
motore_epistemico:
  modelli:
    # Repo HuggingFace in formato MLX, serviti dal demone zeno_engine.mlx_server.
    # I vecchi nomi Ollama restano accettati (zeno_engine/modelli.py::ALIAS).
    # Un solo modello per tutti i ruoli (2,9 GB in memoria).
    router: mlx-community/Qwen3.5-4B-4bit
    motore_batch: mlx-community/Qwen3.5-4B-4bit   # Archivista, Critico, temi
    motore_ask: mlx-community/Qwen3.5-4B-4bit     # risposte in chat
    embeddings: mlx-community/bge-m3-mlx-fp16
  chunk:
    max_chars: 1800
    min_chars: 200
  retrieval:
    top_k: 5
  sync:
    # Chunk nuovi estratti SUBITO all'avvio (una citazione, una recensione):
    # oltre questa soglia si passa al batch in background.
    estrazione_incrementale_max: 12
    # Arretrato grosso: l'Archivista parte da solo, staccato dall'avvio, con
    # questo tetto per esecuzione. archivista_auto: false per disattivarlo.
    archivista_auto: true
    archivista_background_max: 150
    # Job periodici anche ad APP APERTA (2026-08-24): prima giravano
    # solo a `zeno sync`, cioè all'avvio. Il timer vive nella sidebar della chat
    # e non lancia mai il lavoro nel processo della UI: fa partire
    # `zeno manutenzione` staccato.
    periodici_ad_app_aperta: true
    periodici_check_minuti: 15
    # Quiete richiesta dall'ultimo messaggio in chat prima di lanciare un batch:
    # `schede` dura ~40 minuti e si prende il motore MLX.
    periodici_idle_minuti: 10
  briefing:
    frequenza_giorni: 1          # un briefing (con le proposte di ripasso) al giorno
  ripasso:
    soglia_asserzioni_povere: 2  # <= a queste asserzioni una scheda è "povera"
    cooldown_giorni: 14          # non riproporre la stessa scheda prima di N giorni
    max_proposte: 3              # 1-3 "cose da ricordare" per briefing
    # pesi_area: override di zeno_engine/ripasso.py::PESI_AREA_DEFAULT (facoltativo)
    # pesi_temi: override di zeno_engine/ripasso.py::_pesi_temi (facoltativo)
    #   default: {'Vino e sensorialità': 0.1}
    # keyword_archivio_extra: parole aggiuntive (oltre a cross_linker.aree_escluse
    #   + aree_corpus_escluse) da trattare come "contenuto di consultazione"
